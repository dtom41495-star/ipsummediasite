# Génère le site statique (scripts/generer.js) et le publie sur GitHub Pages.
# Toutes les heures, à chaque push sur master et à la demande : construit le site puis le publie sur GitHub Pages.
# Le domaine est réglé par la variable de dépôt SITE_DOMAINE (Settings > Secrets and variables > Actions > Variables).
name: Site statique

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dimensions des photos des articles : lues une seule fois puis gardées d'une génération à l'autre (lib/images.js)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dimensions-images-${{ github.run_id }}
          restore-keys: dimensions-images-
      - name: Générer le site
        run: node scripts/generer.js --sortie public ${{ vars.SITE_DOMAINE && format('--domaine {0}', vars.SITE_DOMAINE) || '' }}
      - name: Contrôle rapide
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          test -s public/sitemap-news.xml
          echo "Articles : $(ls public/articles | wc -l) · Communes : $(ls public/commune 2>/dev/null | wc -l) · Rubriques : $(ls public/rubrique 2>/dev/null | wc -l) · Journalistes : $(ls public/auteurs 2>/dev/null | wc -l)"
          ! grep -rl '\.netlify/functions' public
          test "$(ls public/articles | wc -l)" -ge 20   # garde-fou : jamais publier un site quasi vide
      - uses: actions/upload-artifact@v4
        with:
          name: site-genere
          path: public
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: public

  publier:
    needs: construire
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
