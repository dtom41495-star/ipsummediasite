[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/articles/*"
  to = "/.netlify/functions/article/:splat"
  status = 200

# Le fichier articles.html existe encore (copie de secours), donc "force" pour que la fonction
# (cartes déjà écrites dans le HTML, pour les moteurs de recherche) passe devant.
[[redirects]]
  from = "/articles.html"
  to = "/.netlify/functions/articles-liste"
  status = 200
  force = true

# Page publique de vérification des cartes de membre (QR code de la carte d'adhérent
# générée par Compo) : ipsummedia.fr/membre?c=<code>
[[redirects]]
  from = "/membre"
  to = "/membre.html"
  status = 200
