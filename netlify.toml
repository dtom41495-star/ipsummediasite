[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/articles/*"
  to = "/.netlify/functions/article/:splat"
  status = 200

# Accueil d'une édition (/tarn, /haute-garonne, /national) : la même page statique, le script de l'accueil filtre selon l'adresse
[[redirects]]
  from = "/tarn"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/haute-garonne"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/national"
  to = "/index.html"
  status = 200

# Avec une barre finale, les liens relatifs de la page casseraient
[[redirects]]
  from = "/tarn/"
  to = "/tarn"
  status = 301

[[redirects]]
  from = "/haute-garonne/"
  to = "/haute-garonne"
  status = 301

[[redirects]]
  from = "/national/"
  to = "/national"
  status = 301

# Pages d'une commune (/commune/castres) et d'une rubrique (/rubrique/culture), écrites côté serveur pour le référencement
[[redirects]]
  from = "/commune/*"
  to = "/.netlify/functions/theme/commune/:splat"
  status = 200

[[redirects]]
  from = "/rubrique/*"
  to = "/.netlify/functions/theme/rubrique/:splat"
  status = 200

# Page d'un·e journaliste (/auteurs/lola-schwal)
[[redirects]]
  from = "/auteurs/*"
  to = "/.netlify/functions/auteur/:splat"
  status = 200

# Le fichier articles.html existe encore (copie de secours), donc "force" pour que la fonction
# (cartes déjà écrites dans le HTML, pour les moteurs de recherche) passe devant.
[[redirects]]
  from = "/articles.html"
  to = "/.netlify/functions/articles-liste"
  status = 200
  force = true

# Page publique de vérification des cartes de membre (QR code de la carte d'adhérent
# générée par Compo) : ipsummedia.fr/membre?c=<code>
[[redirects]]
  from = "/membre"
  to = "/membre.html"
  status = 200

# Page publique de vérification des documents signés dans Compo (certificat de
# signature, QR code) : ipsummedia.fr/document?code=<code>
[[redirects]]
  from = "/document"
  to = "/document.html"
  status = 200

# Plan du site fabriqué à chaque demande (articles publiés depuis Compo). Le fichier sitemap.xml reste en secours :
# "force" pour que la fonction passe devant.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Appli installable (le navigateur propose d'ajouter le site à l'écran d'accueil, voir sw.js et manifest.webmanifest)
# Le service worker ne doit jamais rester en cache : une nouvelle version doit être lue tout de suite.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# En-têtes de sécurité sur toutes les pages (pas de règle CSP : elle bloquerait la pub, le bandeau cookies et les statistiques)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
